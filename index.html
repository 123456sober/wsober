    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #b8d8f8 0%, #e0f4fb 100%);

            color: #333;

        }

        .header-banner {
            width: 100%;
            max-height: 380px;
            position: relative;
            overflow: hidden;
            background-color: #e0f4fb;
        }
        .header-banner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .banner-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-weight: bold;
            color: white;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem 2rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4facfe;
        }

        .nav-links a {
            margin-left: 2.5rem;
            text-decoration: none;
            color: #555;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #4facfe;
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .posts-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            height: 180px;
        }

        .post-cover {
            width: 280px;
            height: 100%;
            object-fit: cover;
        }

        .post-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .post-title {
            font-size: 1.3rem;
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }

        .post-date {
            color: #999;
            font-size: 0.9rem;

        }

        .post-excerpt {

        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .sidebar-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1rem;
            border: 3px solid #4facfe;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #555;
        }

<!-- 🌈 彩虹进度条脚本 -->
<style>
#loading {
    height: 8px;
    background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    width: 0%;
    transition: width 0.5s;
}
</style>
<script>
let per = [30, 60, 80, 90, 100];
let i = 0;
let bar = document.getElementById('loading');
function run(){
    if(i<per.length){
        bar.style.width = per[i]+'%';
        i++;
        setTimeout(run,400);
    }else{
        setTimeout(()=>bar.style.display='none',600);
    }
}
run();
</script>
