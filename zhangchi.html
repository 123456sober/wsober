        <h1>张翅：从群演到舞台的温柔少年</h1>
        <p>张翅，2001年10月22日出生于河南新乡，毕业于中央戏剧学院表演系。</p>
        <p>从最底层的群演、光替做起，吃过很多苦，却一直温柔又坚定。一步步走到台前，凭借《浮生印》《少年歌行》等作品被更多人看见。</p>
        <p>后来登上央视网络春晚，从横店小人物走到大舞台，是非常励志的少年。</p>
